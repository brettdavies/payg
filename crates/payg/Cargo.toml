[package]
name = "payg"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "Pay-as-you-go crypto micropayments for CLI tools"
license = "MIT"

[features]
default = ["x402"]
x402 = ["dep:x402-types", "dep:x402-chain-eip155", "dep:reqwest"]
eth = ["dep:alloy-provider", "dep:alloy-rpc-types-eth", "dep:alloy-network"]

[dependencies]
alloy-primitives = "1.5"
alloy-signer-local = { version = "1.6", features = ["keystore"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
rpassword = "7.3"

# x402 backend
x402-types = { version = "1.1", optional = true }
x402-chain-eip155 = { version = "1.1", features = ["client"], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }

# eth backend
alloy-provider = { version = "1.6", optional = true }
alloy-rpc-types-eth = { version = "1.6", optional = true }
alloy-network = { version = "1.6", optional = true }
