name: Release

on:
  push:
    branches: [main]

# Deny all permissions by default; grant per-job
permissions: {}

# The group key leads with a literal token naming the workflow that owns it, so
# it cannot collide with a key a caller or callee produces from context alone.
# This group never cancels: a run killed part way leaves a half-finished
# release or deploy.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    # Prevent forks from running release automation
    if: github.repository == 'brettdavies/payg'
    permissions:
      contents: write
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@f708778669256143d984cce4b23592637532e040 # v0.5.127
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    # Prevent forks from running release automation
    if: github.repository == 'brettdavies/payg'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@f708778669256143d984cce4b23592637532e040 # v0.5.127
        with:
          command: release-pr
        env:
          # NOTE: GITHUB_TOKEN cannot trigger CI on release PRs.
          # Release PRs must be manually verified before merging.
          # See: https://release-plz.dev/docs/github/token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
