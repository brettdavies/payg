name: Release

on:
  push:
    branches: [main]

# Deny all permissions by default; grant per-job
permissions: {}

jobs:
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    # Prevent forks from running release automation
    if: github.repository == 'brettdavies/payg'
    permissions:
      contents: write
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    # Prevent forks from running release automation
    if: github.repository == 'brettdavies/payg'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release-pr
        env:
          # NOTE: GITHUB_TOKEN cannot trigger CI on release PRs.
          # Release PRs must be manually verified before merging.
          # See: https://release-plz.dev/docs/github/token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
